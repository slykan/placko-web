plugins { id 'com.android.application' }

// Upload key lives outside the repo in Desktop/CLAUDE/placko-keys (keystore.properties + placko-upload.jks).
def keystoreFile = rootProject.file('../../../placko-keys/keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'app.placko.mobile'
    signingConfigs {
        if (keystoreFile.exists()) {
            upload {
                storeFile new File(keystoreFile.parentFile, keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.upload
            }
        }
    }
    compileSdk 36
    defaultConfig {
        applicationId 'app.placko.mobile'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '0.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
